<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">OrgAnchor origin anchor and multi-turn public record spiral</title>
  <desc id="desc">A gold origin anchor joins the first o of the one-stroke OrgAnchor wordmark to an open multi-turn path carrying a finite sequence of public record nodes.</desc>
